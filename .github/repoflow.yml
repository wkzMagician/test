repository:
  visibility: public

branches:
  main:
    approvals: 1
  dev:
    approvals: 1

developers: []

ci:
  enabled: true

ai:
  enabled: true
  provider:
    type: openai-compatible
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-flash-0731
    api_key: secret:REPOFLOW_AI_API_KEY
  analysis:
    issues: true
    rate_limit:
      max_per_user: 5
      window_minutes: 60
  policy:
    auto_fix_bugs: true
    min_confidence: 0.85
  ci_debug: true

release:
  enabled: true
